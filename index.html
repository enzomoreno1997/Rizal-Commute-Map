<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rizal Commute Map</title>
  
  <!-- Leaflet CSS & Routing Machine CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css" />
  
  <style>
    body, html { margin: 0; padding: 0; height: 100%; font-family: Arial, sans-serif; }
    #map { height: 100vh; width: 100%; }
    /* Itago ang side panel ng routing para linis ang mapa */
    .leaflet-routing-container { display: none !important; }
  </style>
</head>
<body>

  <div id="map"></div>

  <!-- Leaflet JS & Routing Machine JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.min.js"></script>

  <script>
    const map = L.map('map').setView([14.6200, 121.1200], 12);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    // Coordinate Points
    const padilla = L.latLng(14.6190, 121.1730);
    const marikina = L.latLng(14.6295, 121.0960);
    const cubao = L.latLng(14.6186, 121.0535);

    // 1. Ruta: Padilla to Cubao (Awtomatikong lalapat sa kalsada)
    L.Routing.control({
      waypoints: [padilla, cubao],
      lineOptions: { styles: [{ color: '#1e88e5', weight: 6, opacity: 0.8 }] },
      createMarker: function(i, wp) {
        if (i === 0) return L.marker(wp.latLng).bindPopup("<b>Padilla Terminal</b>");
        if (i === 1) return L.marker(wp.latLng).bindPopup("<b>Cubao Terminal</b>");
      },
      addWaypoints: false,
      draggableWaypoints: false
    }).addTo(map);

    // 2. Ruta: Padilla to Marikina (Awtomatikong lalapat sa kalsada)
    L.Routing.control({
      waypoints: [padilla, marikina],
      lineOptions: { styles: [{ color: '#e53935', weight: 5, opacity: 0.8, dashArray: '8, 8' }] },
      createMarker: function(i, wp) {
        if (i === 1) return L.marker(wp.latLng).bindPopup("<b>Marikina City Center</b>");
      },
      addWaypoints: false,
      draggableWaypoints: false
    }).addTo(map);
  </script>
</body>
</html>
